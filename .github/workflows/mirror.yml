name: Mirror Facebook page

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      clear_first:
        description: "Delete all existing mirrored posts first (tick for the first run only)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create posts from the group
        run: python scripts/mirror.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GROUP_URL: ${{ secrets.GROUP_URL }}
          CLEAR_FIRST: ${{ inputs.clear_first }}

      - name: Save new posts and rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add new mirrored posts"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
