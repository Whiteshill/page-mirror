name: Mirror Facebook page

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the feed reader
        run: pip install feedparser

      - name: Create posts from the feed
        run: python scripts/mirror.py
        env:
          FEED_URL: ${{ secrets.FEED_URL }}

      - name: Save new posts and rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add new mirrored posts"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
